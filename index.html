<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Out With Me?</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffe6e9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
      position: relative;
    }
    h1 {
      color: #ff4b6e;
      font-size: 1.6rem;
      margin-bottom: 20px;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      min-height: 50px;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s ease;
    }
    #yesBtn {
      background-color: #ff4b6e;
      color: white;
    }
    #yesBtn:hover {
      transform: scale(1.05);
    }
    #noBtn {
      background-color: #e0e0e0;
      color: #333;
      position: absolute;
      z-index: 999;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      color: #555;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ffd1d7;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus {
      border-color: #ff4b6e;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Screen 1: The Question -->
  <div class="card" id="mainCard">
    <h1>Will you go out with me? 🌹</h1>
    <div class="btn-container">
      <button id="yesBtn" onclick="openPlanner()">Yes!</button>
      <button id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No</button>
    </div>
  </div>

  <!-- Screen 2: Details Form -->
  <div class="card hidden" id="detailsCard">
    <h1>Awesome! Pick Details 📅</h1>
    
    <form id="dateForm" action="https://formspree.io/f/xbglgobv" method="POST" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="date">Select Date:</label>
        <input type="date" id="date" name="Date" required>
      </div>

      <div class="form-group">
        <label for="time">Select Time:</label>
        <input type="time" id="time" name="Time" required>
      </div>

      <div class="form-group">
        <label for="activity">What are we doing?</label>
        <select id="activity" name="Activity">
          <option>Dinner & Drinks 🍽️</option>
          <option>Movie Night 🍿</option>
          <option>Ice Cream & Walk 🍦</option>
          <option>Surprise Me! ✨</option>
        </select>
      </div>

      <div class="form-group">
        <label for="location">Where should we go? 📍</label>
        <input type="text" id="location" name="Location" placeholder="Type a place or spot...">
      </div>

      <button type="submit" id="yesBtn" style="width: 100%; margin-top: 10px;">Confirm Date ❤️</button>
    </form>
  </div>

  <!-- Screen 3: Final Confirmation -->
  <div class="card hidden" id="successCard">
    <h1>It's a Date! 🎉</h1>
    <p id="summaryText" style="font-size: 1.05rem; color: #444; margin-top: 15px; line-height: 1.5;"></p>
  </div>

  <script>
    window.onload = function() {
      const noBtn = document.getElementById('noBtn');
      noBtn.style.position = 'relative';
    };

    function dodgeNo() {
      const noBtn = document.getElementById('noBtn');
      noBtn.style.position = 'fixed';

      const padding = 40;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    function openPlanner() {
      document.getElementById('mainCard').classList.add('hidden');
      document.getElementById('detailsCard').classList.remove('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const form = event.target;
      const dateVal = document.getElementById('date').value;
      const timeVal = document.getElementById('time').value;
      const activityVal = document.getElementById('activity').value;
      const locationVal = document.getElementById('location').value;

      if (!dateVal || !timeVal) {
        alert('Please pick both a date and a time!');
        return;
      }

      fetch(form.action, {
        method: form.method,
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).catch(error => console.log('Form submission error:', error));

      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });

      const placeText = locationVal.trim() ? ` at <b>${locationVal}</b>` : '';

      document.getElementById('detailsCard').classList.add('hidden');
      document.getElementById('successCard').classList.remove('hidden');
      document.getElementById('summaryText').innerHTML = 
        `Can't wait! See you on <b>${dateVal}</b> at <b>${timeVal}</b> for <b>${activityVal}</b>${placeText}!`;
    }
  </script>

</body>
</html>
